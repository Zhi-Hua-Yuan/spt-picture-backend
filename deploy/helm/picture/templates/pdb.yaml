{{- if .Values.podDisruptionBudget.enabled }}
{{- range $name := list "core" "media" "search" }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "picture.fullname" $ }}-{{ $name }}
  labels:
    {{- include "picture.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  minAvailable: {{ $.Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "picture.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
---
{{- end }}
{{- end }}
