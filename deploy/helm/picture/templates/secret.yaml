{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "picture.secretName" . }}
  labels:
    {{- include "picture.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  CORE_DB_PASSWORD: {{ .Values.secrets.coreDbPassword | quote }}
  MEDIA_DB_PASSWORD: {{ .Values.secrets.mediaDbPassword | quote }}
  SEARCH_DB_PASSWORD: {{ .Values.secrets.searchDbPassword | quote }}
  COS_SECRET_ID: {{ .Values.secrets.cosSecretId | quote }}
  COS_SECRET_KEY: {{ .Values.secrets.cosSecretKey | quote }}
  COS_REGION: {{ .Values.secrets.cosRegion | quote }}
  COS_BUCKET_NAME: {{ .Values.secrets.cosBucketName | quote }}
  COS_HOST: {{ .Values.secrets.cosHost | quote }}
  PICTURE_SEARCH_INTERNAL_TOKEN: {{ .Values.secrets.internalToken | quote }}
{{- end }}
