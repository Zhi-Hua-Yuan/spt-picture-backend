images:
  core:
    repository: ghcr.io/zhi-hua-yuan/picture-core-api
    tag: latest
    pullPolicy: IfNotPresent
  media:
    repository: ghcr.io/zhi-hua-yuan/picture-media-service
    tag: latest
    pullPolicy: IfNotPresent
  search:
    repository: ghcr.io/zhi-hua-yuan/picture-search-service
    tag: latest
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/zhi-hua-yuan/yu-picture-frontend
    tag: latest
    pullPolicy: IfNotPresent

replicaCount:
  core: 2
  media: 2
  search: 2
  frontend: 2

service:
  core: { port: 8123 }
  media: { port: 8124 }
  search: { port: 8125 }
  frontend: { port: 80 }

resources: {}

dependencies:
  mysqlHost: mysql
  redisHost: redis
  rabbitmqHost: rabbitmq
  elasticsearchHost: elasticsearch
  rabbitmqUsername: guest
  rabbitmqPassword: guest

secrets:
  create: true
  name: picture-secrets
  dbPassword: change-me
  coreDbPassword: change-me
  mediaDbPassword: change-me
  searchDbPassword: change-me
  cosSecretId: ""
  cosSecretKey: ""
  cosRegion: ap-guangzhou
  cosBucketName: ""
  cosHost: ""
  internalToken: change-me-internal

ingress:
  enabled: false
  className: nginx
  host: picture.local
  tls: []

monitoring:
  serviceMonitor:
    enabled: false
    interval: 30s
  prometheusRule:
    enabled: false

podDisruptionBudget:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

frontend:
  enabled: true
