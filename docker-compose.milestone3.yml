services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-spt_picture}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_CORE_PASSWORD: ${CORE_DB_PASSWORD:-change-me}
      MYSQL_MEDIA_PASSWORD: ${MEDIA_DB_PASSWORD:-change-me}
      MYSQL_SEARCH_PASSWORD: ${SEARCH_DB_PASSWORD:-change-me}
    ports:
      - "13306:3306"
    volumes:
      - spt-picture-mysql-data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - spt-picture-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - spt-picture-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30

  elasticsearch:
    build:
      context: ./infra/elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - spt-picture-es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  picture-core-api:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: picture-core-api
        BUILD_FROM_SOURCE: ${BUILD_FROM_SOURCE:-true}
    ports:
      - "8123:8123"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-spt_picture}
      DB_USERNAME: picture_core
      DB_PASSWORD: ${CORE_DB_PASSWORD:-change-me}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      ELASTICSEARCH_ENDPOINT: http://elasticsearch:9200
      PICTURE_SEARCH_MODE: ${PICTURE_SEARCH_MODE:-REMOTE}
      PICTURE_SEARCH_REMOTE_BASE_URL: http://picture-search-service:8125
      PICTURE_SEARCH_INTERNAL_TOKEN: ${PICTURE_SEARCH_INTERNAL_TOKEN:-change-me-internal}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_REGION: ${COS_REGION:-ap-guangzhou}
      COS_BUCKET_NAME: ${COS_BUCKET_NAME:-}
      COS_HOST: ${COS_HOST:-}
      FLYWAY_ENABLED: "true"
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}

  picture-media-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: picture-media-service
        BUILD_FROM_SOURCE: ${BUILD_FROM_SOURCE:-true}
    ports:
      - "8124:8124"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/spt_picture_media
      DB_USERNAME: picture_media
      DB_PASSWORD: ${MEDIA_DB_PASSWORD:-change-me}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_REGION: ${COS_REGION:-ap-guangzhou}
      COS_BUCKET_NAME: ${COS_BUCKET_NAME:-}
      COS_HOST: ${COS_HOST:-}
      FLYWAY_ENABLED: "true"
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

  picture-search-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: picture-search-service
        BUILD_FROM_SOURCE: ${BUILD_FROM_SOURCE:-true}
    environment:
      DB_URL: jdbc:mysql://mysql:3306/spt_picture_search
      DB_USERNAME: picture_search
      DB_PASSWORD: ${SEARCH_DB_PASSWORD:-change-me}
      RABBITMQ_HOST: rabbitmq
      ELASTICSEARCH_ENDPOINT: http://elasticsearch:9200
      PICTURE_CORE_BASE_URL: http://picture-core-api:8123/api
      PICTURE_SEARCH_INTERNAL_TOKEN: ${PICTURE_SEARCH_INTERNAL_TOKEN:-change-me-internal}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_REGION: ${COS_REGION:-ap-guangzhou}
      COS_BUCKET_NAME: ${COS_BUCKET_NAME:-}
      COS_HOST: ${COS_HOST:-}
      FLYWAY_ENABLED: "true"
    depends_on:
      picture-core-api: {condition: service_started}
      mysql: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}

volumes:
  spt-picture-mysql-data:
  spt-picture-redis-data:
  spt-picture-rabbitmq-data:
  spt-picture-es-data:
