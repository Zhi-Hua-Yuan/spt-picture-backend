name: backend-ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Checkout frontend master
        uses: actions/checkout@v4
        with:
          repository: Zhi-Hua-Yuan/yu-picture-frontend
          ref: master
          path: yu-picture-frontend
          token: ${{ secrets.FRONTEND_REPO_TOKEN }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: yu-picture-frontend/package-lock.json

      - name: Build frontend
        working-directory: yu-picture-frontend
        run: npm ci && npm run build

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Verify backend
        run: mvn -B -ntp verify

      - name: Validate compose and Helm
        run: |
          docker compose -f docker-compose.milestone3.yml config
          helm lint deploy/helm/picture -f deploy/helm/picture/values-demo.yaml
          helm template picture deploy/helm/picture -f deploy/helm/picture/values-demo.yaml >/tmp/picture.yaml
          helm lint deploy/helm/picture -f deploy/helm/picture/values-prod.yaml
          helm template picture deploy/helm/picture -f deploy/helm/picture/values-prod.yaml >/tmp/picture-prod.yaml

  kind-smoke:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Checkout frontend master
        uses: actions/checkout@v4
        with:
          repository: Zhi-Hua-Yuan/yu-picture-frontend
          ref: master
          path: yu-picture-frontend
          token: ${{ secrets.FRONTEND_REPO_TOKEN }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build local images
        run: |
          docker build -t picture-core-api:local --build-arg SERVICE=picture-core-api -f Dockerfile.service .
          docker build -t picture-media-service:local --build-arg SERVICE=picture-media-service -f Dockerfile.service .
          docker build -t picture-search-service:local --build-arg SERVICE=picture-search-service -f Dockerfile.service .
          docker build -t yu-picture-frontend:local yu-picture-frontend

      - name: Set up kind
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: picture-ci

      - name: Load images
        run: |
          kind load docker-image picture-core-api:local --name picture-ci
          kind load docker-image picture-media-service:local --name picture-ci
          kind load docker-image picture-search-service:local --name picture-ci
          kind load docker-image yu-picture-frontend:local --name picture-ci

      - name: Run chart smoke test
        run: bash deploy/kind/smoke.sh

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [verify, kind-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Checkout frontend master
        uses: actions/checkout@v4
        with:
          repository: Zhi-Hua-Yuan/yu-picture-frontend
          ref: master
          path: yu-picture-frontend
          token: ${{ secrets.FRONTEND_REPO_TOKEN }}
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release images
        env:
          IMAGE_TAG: ${{ github.sha }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          image_prefix="ghcr.io/$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"

          build_and_push() {
            local image_name="$1"
            shift
            docker build \
              -t "${image_prefix}/${image_name}:${IMAGE_TAG}" \
              -t "${image_prefix}/${image_name}:latest" \
              "$@"
            docker push "${image_prefix}/${image_name}:${IMAGE_TAG}"
            docker push "${image_prefix}/${image_name}:latest"
          }

          build_and_push picture-core-api \
            --build-arg SERVICE=picture-core-api \
            -f Dockerfile.service .
          build_and_push picture-media-service \
            --build-arg SERVICE=picture-media-service \
            -f Dockerfile.service .
          build_and_push picture-search-service \
            --build-arg SERVICE=picture-search-service \
            -f Dockerfile.service .
          build_and_push yu-picture-frontend yu-picture-frontend

      - name: Publish image summary
        env:
          IMAGE_TAG: ${{ github.sha }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          image_prefix="ghcr.io/$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "### Published images"
            echo ""
            printf 'Tag: `%s`\n' "${IMAGE_TAG}"
            echo ""
            printf -- '- `%s/picture-core-api:%s`\n' "${image_prefix}" "${IMAGE_TAG}"
            printf -- '- `%s/picture-media-service:%s`\n' "${image_prefix}" "${IMAGE_TAG}"
            printf -- '- `%s/picture-search-service:%s`\n' "${image_prefix}" "${IMAGE_TAG}"
            printf -- '- `%s/yu-picture-frontend:%s`\n' "${image_prefix}" "${IMAGE_TAG}"
          } >> "${GITHUB_STEP_SUMMARY}"
