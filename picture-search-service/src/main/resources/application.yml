server:
  port: ${SERVER_PORT:8125}

spring:
  application:
    name: picture-search-service
  datasource:
    url: ${SEARCH_DB_URL:${DB_URL:jdbc:mysql://localhost:3306/spt_picture_search}}
    username: ${SEARCH_DB_USERNAME:${DB_USERNAME:picture_search}}
    password: ${SEARCH_DB_PASSWORD:${DB_PASSWORD:change-me}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration/search
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        default-requeue-rejected: false
        missing-queues-fatal: false

mybatis-plus:
  global-config.db-config:
    logic-delete-field: isDelete
    logic-delete-value: 1
    logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: false
    log-impl: ''

management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health.probes.enabled: true
  metrics.tags.application: ${spring.application.name}
  tracing.sampling.probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.1}

picture:
  inbox.lease-seconds: ${PICTURE_INBOX_LEASE_SECONDS:60}
  async:
    search-index-enabled: ${PICTURE_ASYNC_SEARCH_INDEX_ENABLED:true}
    index-maintenance-enabled: ${PICTURE_ASYNC_INDEX_MAINTENANCE_ENABLED:true}
    search-index-concurrency: ${PICTURE_ASYNC_SEARCH_INDEX_CONCURRENCY:2}
    index-maintenance-concurrency: ${PICTURE_ASYNC_INDEX_MAINTENANCE_CONCURRENCY:1}
  search:
    enabled: ${PICTURE_SEARCH_ENABLED:true}
    internal-token: ${PICTURE_SEARCH_INTERNAL_TOKEN:change-me-internal}
    core-base-url: ${PICTURE_CORE_BASE_URL:http://localhost:8123/api}
    reconcile-enabled: ${PICTURE_ASYNC_RECONCILE_ENABLED:true}
    reconcile-cron: ${PICTURE_SEARCH_RECONCILE_CRON:0 0 3 * * *}
    elasticsearch:
      endpoint: ${ELASTICSEARCH_ENDPOINT:http://localhost:9200}
      username: ${ELASTICSEARCH_USERNAME:}
      password: ${ELASTICSEARCH_PASSWORD:}
      connect-timeout-ms: ${ELASTICSEARCH_CONNECT_TIMEOUT_MS:500}
      socket-timeout-ms: ${ELASTICSEARCH_SOCKET_TIMEOUT_MS:1200}
      index-prefix: ${ELASTICSEARCH_INDEX_PREFIX:picture_search}

cos:
  client:
    secretId: ${COS_SECRET_ID:}
    secretKey: ${COS_SECRET_KEY:}
    region: ${COS_REGION:ap-guangzhou}
    bucketName: ${COS_BUCKET_NAME:}
    host: ${COS_HOST:}
