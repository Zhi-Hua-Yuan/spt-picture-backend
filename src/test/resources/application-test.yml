spring:
  main:
    allow-bean-definition-overriding: true
  flyway:
    enabled: true
    baseline-on-migrate: false
  session:
    store-type: redis
    redis:
      namespace: spt-picture:session:v3-test
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        auto-startup: false
  datasource:
    hikari:
      maximum-pool-size: 5
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

picture:
  async:
    enabled: false
  search:
    enabled: true
    mode: MYSQL

cos:
  client:
    secretId: test-secret-id
    secretKey: test-secret-key
    bucketName: test-bucket
    region: ap-shanghai
    host: http://wiremock-cos.test

aliYunAi:
  apiKey: test-dashscope-key

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /doc.html
