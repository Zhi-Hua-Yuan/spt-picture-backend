server:
  port: 8080
  servlet:
    context-path: /api
    # cookie 30天后过期
    session:
      cookie:
        max-age: 2592000

spring:
  application:
    name: spt-picture-backend
  # 数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/spt_picture
    username: root
    password: yunmo_Hua0209
    driver-class-name: com.mysql.cj.jdbc.Driver
  profiles:
    active: local
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  redis:
    port: 6379
    host: 127.0.0.1
    timeout: 5000
    database: 0
  session:
    store-type: redis
    # session 30天后过期
    timeout: 2592000
  # 空间图片分表
  shardingsphere:
    datasource:
      names: spt_picture
      spt_picture:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://localhost:3306/spt_picture
        username: root
        password: yunmo_Hua0209
    rules:
      sharding:
        tables:
          picture:
            actual-data-nodes: spt_picture.picture  # 动态分表
            table-strategy:
              standard:
                sharding-column: spaceId
                sharding-algorithm-name: picture_sharding_algorithm  # 使用自定义分片算法
        sharding-algorithms:
          picture_sharding_algorithm:
            type: CLASS_BASED
            props:
              strategy: standard
              algorithmClassName: com.spt.sptpicturebackend.manager.sharding.PictureShardingAlgorithm
    props:
      sql-show: true

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除字段名
      logic-delete-value: 1 # 逻辑已删除值。可选，默认值为 1
      logic-not-delete-value: 0 # 逻辑未删除值。可选，默认值为 0
    enable-sql-runner: true
  configuration:
    map-underscore-to-camel-case: false
    # 仅在开发环境输出日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

knife4j:
  enable: true
  openapi:
    title: 接口文档
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.spt.sptpicturebackend.controller