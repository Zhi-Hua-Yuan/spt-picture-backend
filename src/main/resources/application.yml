server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: spt-picture-backend
  # 数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/spt_picture
    username: root
    password: yunmo_Hua0209
    driver-class-name: com.mysql.cj.jdbc.Driver
  profiles:
    active: local
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除字段名
      logic-delete-value: 1 # 逻辑已删除值。可选，默认值为 1
      logic-not-delete-value: 0 # 逻辑未删除值。可选，默认值为 0
  configuration:
    map-underscore-to-camel-case: false
    # 仅在开发环境输出日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

knife4j:
  enable: true
  openapi:
    title: 接口文档
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.spt.sptpicturebackend.controller